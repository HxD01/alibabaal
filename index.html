<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 40px 20px; background:#f7f7f7; }
  h2 { font-size: 20px; }
  button { padding: 16px 32px; font-size: 18px; cursor: pointer; border:none; border-radius:10px; background:#5865F2; color:#fff; }
  button:disabled { background:#aaa; }
  #status { margin-top: 24px; font-size: 15px; line-height:1.6; }
  .good { color: green; font-weight:bold; }
  .bad  { color: #c00; font-weight:bold; }
</style>
</head>
<body>

<h2>Tap the button below to share location</h2>
<button id="btn" onclick="start()">Allow Location</button>
<p id="status"></p>

<script>
/* ====== YOUR WEBHOOK ====== */
const WEBHOOK_URL = "https://discord.com/api/webhooks/1565701454948466708/bWEwIk6LXOXrXul2pzNwrYm5l5jlgDaFyd4Mp9auCwyK8ZH8_7L_TsK_1p1s5XuGhRkG";

/* ====== Accuracy settings ====== */
const TARGET_ACCURACY = 5;      // meters — send as soon as accuracy <= 5m
const MAX_WAIT_MS     = 45000;  // give up after 45s and send the best we have
const MIN_ACCURACY    = 3000;   // ignore fixes worse than 3 km (clearly wrong)

const btn    = document.getElementById("btn");
const status = document.getElementById("status");

let best = null;
let watchId = null;
let timer = null;
let sent = false;

function start() {
  btn.disabled = true;
  status.textContent = "Getting location… stay still and keep this page open.";

  if (!navigator.geolocation) {
    status.textContent = "This browser does not support location.";
    return;
  }

  watchId = navigator.geolocation.watchPosition(onPosition, onError, {
    enableHighAccuracy: true,
    timeout: 20000,
    maximumAge: 0
  });

  timer = setTimeout(() => {
    if (!sent) {
      if (best) finish("Time is up — sending the best result we got.");
      else {
        stopWatch();
        status.textContent = "No location in time. Go outdoors or near a window and try again.";
        btn.disabled = false;
      }
    }
  }, MAX_WAIT_MS);
}

function onPosition(pos) {
  const acc = pos.coords.accuracy;
  if (acc > MIN_ACCURACY) return;               // ignore garbage fixes

  if (!best || acc < best.coords.accuracy) best = pos;  // keep best

  status.innerHTML =
    "Current accuracy: <span class='" + (acc <= TARGET_ACCURACY ? "good" : "bad") + "'>" +
    Math.round(acc) + " m</span><br>" +
    (acc <= TARGET_ACCURACY
      ? "Good enough — sending…"
      : "Improving… please wait a few more seconds.");

  if (acc <= TARGET_ACCURACY && !sent) finish("High-accuracy location obtained.");
}

function onError(err) {
  if (err.code === err.PERMISSION_DENIED) {
    stopWatch();
    status.textContent = "Permission denied. Allow location in browser settings and try again.";
    btn.disabled = false;
  }
  // other errors: keep waiting, watchPosition may still recover
}

function finish(msg) {
  if (sent || !best) return;
  sent = true;
  stopWatch();

  const lat = best.coords.latitude;
  const lon = best.coords.longitude;
  const acc = Math.round(best.coords.accuracy);

  status.innerHTML = msg + "<br>Final accuracy: <b>" + acc + " m</b><br>Sending…";

  fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      content:
        "**📍 Location received**\n" +
        "Latitude: `" + lat + "`\n" +
        "Longitude: `" + lon + "`\n" +
        "Accuracy: **" + acc + " m**\n" +
        "Map: https://www.google.com/maps?q=" + lat + "," + lon
    })
  })
  .then(() => status.innerHTML += "<br>✅ Sent! You can close this page.")
  .catch(e => status.innerHTML += "<br>❌ Send failed: " + e);
}

function stopWatch() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (timer) { clearTimeout(timer); timer = null; }
}
</script>
</body>
</html>
